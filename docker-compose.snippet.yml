services:
  web-app:
    build: ./repo-web-app
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    environment:
      - NEXT_PUBLIC_APP_NAME=CampusCast CMS
      - NEXT_PUBLIC_API_PREFIX=/api/v1
      - NEXT_PUBLIC_WS_SYNC_URL=ws://localhost/ws/sync
      - BACKEND_BASE_URL=http://nginx
