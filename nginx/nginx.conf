# Edge reverse-proxy for SSR Next.js + API gateway + WS sync

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Browser cannot set custom WS headers directly; we pass bearer via subprotocol:
# Sec-WebSocket-Protocol: json, bearer.<token>
map $http_sec_websocket_protocol $ws_authorization {
  default "";
  ~*bearer\.(.+) "Bearer $1";
}

upstream web_app {
  server web-app:3000;
}

# Existing infra gateway entrypoint (from root docker-compose service `nginx`).
upstream api_gateway {
  server nginx:80;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 2048m;

  location / {
    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /api/v1/ {
    proxy_pass http://api_gateway/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
  }

  location /ws/sync {
    proxy_pass http://api_gateway/ws/sync;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Authorization $ws_authorization;
  }

  location /health {
    proxy_pass http://api_gateway/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
